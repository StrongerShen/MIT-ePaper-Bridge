name: EpaperBridge
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
targets:
  EpaperBridge:
    type: application
    platform: iOS
    sources:
      - EpaperBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mit.EpaperBridge
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: EpaperBridge.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - sdk: CoreBluetooth.framework
      - sdk: CoreNFC.framework
      - sdk: AudioToolbox.framework
      - sdk: PhotosUI.framework
      - sdk: CoreImage.framework
    scheme:
      testTargets: []
